<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="text-title">Basic Calculator</h1>
    <h2 class="text-description">Basic Calculator created with HTML, CSS, and JavaScript</h2>
    <div class="calculator">
        <div class="screen">0</div>
        <div class="calc-btn">
            <!--same class name, because same styling in CSS-->
            <div class="list-btn">
                <button class="two-spaces">C</button>
                <button><--</button>
                <button class="ops-btn">/</button>
            </div>
            <div class="list-btn">
                <button>9</button>
                <button>8</button>
                <button>7</button>
                <button class="ops-btn">x</button>
            </div>
            <div class="list-btn">
                <button>6</button>
                <button>5</button>
                <button>4</button>
                <button class="ops-btn">-</button>
            </div>
            <div class="list-btn">
                <button>3</button>
                <button>2</button>
                <button>1</button>
                <button class="ops-btn">+</button>
            </div>
            <div class="list-btn">
                <button class="three-spaces">0</button>
                <button class="ops-btn">=</button>
            </div>
        </div>
    </div>
<script src="main.js"></script>
</body>
</html>
